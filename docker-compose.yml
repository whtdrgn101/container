# Deploy Game Hub on a home server (e.g. via Portainer). One service, one port, one volume.
# The game will be reachable at http://<your-nas-ip>:8080 — change the left-hand port if 8080 is taken.
#
# This file references the CI-built image on Docker Hub (pushed on every main merge), which is what
# lets Watchtower auto-update the running stack. There is deliberately NO `build:` block here —
# local play-testing keeps `docker compose up --build` working via docker-compose.override.yml,
# which the compose CLI auto-merges (and Portainer, pointed at this file, never sees).
services:
  game-hub:
    image: whtdrgn101/game-hub:latest
    container_name: game-hub
    restart: unless-stopped
    labels:
      # The owner's Watchtower runs label-scoped (WATCHTOWER_LABEL_ENABLE) so it can't surprise
      # version-pinned services (Jellyfin, Gitea). Game Hub tracks :latest on purpose — CI owns the
      # tag and the /data volume carries the games — so it opts in explicitly.
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8080:3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /data/game-hub.sqlite
    volumes:
      - game-hub-game-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  game-hub-game-data:
