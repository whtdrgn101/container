# Deploy Container on a home server (e.g. via Portainer). One service, one port, one volume.
# The game will be reachable at http://<your-nas-ip>:8080 — change the left-hand port if 8080 is taken.
services:
  container-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: container-game:latest
    container_name: container-game
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /data/container.sqlite
    volumes:
      - container-game-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  container-game-data:
