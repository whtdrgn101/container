name: CI

# Build → test → publish the single Game Hub image to Docker Hub.
#
# Every push to `main` runs the unit/integration suites and, only if they pass, builds the image and
# pushes two tags: `latest` and `v<run-number>` (an integer that GitHub increments on every run — so
# each build gets its own immutable, incrementing version while `latest` always points at the newest).
#
# Deliberately NOT run here yet: the Playwright e2e suite. Its visual-regression spec only has macOS
# baselines and is guaranteed-red on Linux (REVIEW.md §2.2); wiring e2e in needs Linux baselines
# generated in the Playwright container first. Until then the image is gated on engine (100%), bot
# (90%) and backend (coverage-gated) tests plus a full typecheck — not on the browser flows.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

# Cancel an in-flight run if you push again to the same branch — no point building a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: whtdrgn101/game-hub

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm first (setup-node's pnpm cache needs it on PATH). No version here: action-setup reads the
      # `packageManager` field in package.json, so CI uses the exact pnpm the repo pins.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `allowBuilds` in pnpm-workspace.yaml lets install compile better-sqlite3 + esbuild, which the
      # backend tests need to load SQLite.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck # all four packages (ui included)

      - run: pnpm test # engine + bot + backend; `ui` has no unit `test` script so it's skipped

  docker:
    name: Build & push image
    needs: test # never publish an image whose tests didn't pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: . # the root Dockerfile does `COPY . .`; it needs the whole workspace
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ github.run_number }}
          # Reuse layers across runs (native SQLite build + UI bundle are the slow parts).
          cache-from: type=gha
          cache-to: type=gha,mode=max
