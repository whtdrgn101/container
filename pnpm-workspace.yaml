packages:
  - packages/*
  - backend
  - ui

# Native/postinstall build scripts we explicitly trust (pnpm blocks all others).
allowBuilds:
  esbuild: true
  better-sqlite3: true

# Peers are contracts for EXTERNAL consumers (a published ui-kit expects the host to bring
# react and @game-hub/kernel); inside this workspace every real dependency is declared
# explicitly. With the default (true), the Dockerfile's `pnpm deploy --prod` drops the
# workspace devDeps that satisfy those peers and then tries to FETCH them from the npm
# registry — a 404 for @game-hub/* until they're published, and wrong even after (the image
# must build from workspace source, never from the registry's copy of our own packages).
autoInstallPeers: false

# ⚠️ Track D — required by every *externally built* game. Since 2026-07-31 all six games are installed
# from the public npm registry (`@game-hub/game-*@^0.1.0`); each declares plain semver peers on
# `@game-hub/kernel` (^1.2.0) and `@game-hub/ui-kit` (^1.0.0), because from out there those are ordinary
# published packages. pnpm 10+ defaults this setting to **false**, so a non-`workspace:` range is
# resolved from the registry even when this very repo builds the package — and it did: the backend (which
# declares no ui-kit of its own, and shouldn't — it has no React) got a **registry copy of
# `@game-hub/ui-kit@1.0.0`** grafted in as a peer, which then forked the game into two physical copies
# (one per peer set) and dragged a `minimumReleaseAgeExclude` entry along with it.
#
# `true` links a matching workspace package instead: one copy of the game, its ui-kit peer resolved to
# `link:packages/ui-kit` — the same module instance the shell uses, which is what keeps React context
# identity (`RematchContext`) intact across the seam. It is also just the rule the comment above already
# states — our own packages come from workspace source, never the registry's copy of them.
#
# Safe here because every in-repo dependency on a `@game-hub/*` package is already written
# `workspace:*`; this setting only changes how an *external* package's peers on our packages resolve.
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  # Euchre (game 8) — published today, so it is excluded from the release-age gate exactly like every
  # other game's first release was. Delete this line once it ages past the threshold.
  - '@game-hub/game-euchre@0.1.0'
  - '@game-hub/game-cantstop@0.1.0'
  - '@game-hub/game-container@0.1.0'
  - '@game-hub/game-labyrinth@0.1.0'
  - '@game-hub/game-russianrailroads@0.1.0'
  - '@game-hub/game-stoneage@0.1.0'
  - '@game-hub/game-stpetersburg@0.1.0'
  # 0.1.1 adds each game's `GameClient.Icon` (kernel 1.3.0) — the box-lid mark the Card Table shelf
  # renders. Freshly published, so it's excluded from the release-age gate exactly like 0.1.0 was.
  - '@game-hub/game-cantstop@0.1.1'
  - '@game-hub/game-container@0.1.1'
  - '@game-hub/game-labyrinth@0.1.1'
  - '@game-hub/game-russianrailroads@0.1.1'
  - '@game-hub/game-stoneage@0.1.1'
  - '@game-hub/game-stpetersburg@0.1.1'
  # Labyrinth 0.1.3 is its L4c player-feedback pass (banner pawn badge, arrow tooltips off,
  # hide-other-pawns toggle, spider redrawn). Freshly published, so excluded like the two before it.
  # ⚠️ Not 0.1.2 — that publish is deprecated: `npm publish` ignores `publishConfig.exports` and shipped
  # src-pointing exports in a dist-only tarball (game repo, docs/d2c-findings.md §23).
  - '@game-hub/game-labyrinth@0.1.3'
  # Argute 0.1.0 — the seventh game, and the first built from `whtdrgn101/game-template` rather than
  # extracted from this workspace. Freshly published, so excluded like every game before it.
  - '@game-hub/game-argute@0.1.0'
  # Argute 0.2.0 corrects the game's ruling R1 against the publisher's own description: a play is **one
  # card per turn**, so a trick is that many passes round the table rather than a group from each seat.
  # That changes the action shape, hence a breaking bump and a dependency moved by hand. Freshly
  # published, so excluded like every game before it.
  - '@game-hub/game-argute@0.2.0'
  # Argute 0.3.0 is the first game to adopt kernel 1.4.0: its move log is typed to its own record kinds
  # and it declares `GameClient.version`. Freshly published, so excluded like every game before it.
  - '@game-hub/game-argute@0.3.0'
